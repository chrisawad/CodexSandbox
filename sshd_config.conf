Port 2222
AddressFamily any
ListenAddress 0.0.0.0
ListenAddress ::

HostKey /home/sandbox/.ssh/host-keys/ssh_host_ed25519_key
HostKey /home/sandbox/.ssh/host-keys/ssh_host_rsa_key
PidFile /home/sandbox/.cache/sshd.pid

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers sandbox
AuthorizedKeysFile none
AuthorizedKeysCommand /usr/local/bin/agent-authorized-keys
AuthorizedKeysCommandUser sandbox

AllowAgentForwarding yes
AllowTcpForwarding yes
GatewayPorts no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no

UsePAM no
PrintMotd no
Subsystem sftp internal-sftp
