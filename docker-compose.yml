services:
  sandbox:
    build: .
    image: cawad/codex-sandbox:latest
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${EXTERNAL_SSHD_PORT:-2222}:2222"
    # First-time SSH connection
    # Run `ssh -p 2222 sandbox@127.0.0.1` from the same host environment as the
    # client, then review and accept the host key before using Codex Desktop.
    # If EXTERNAL_SSHD_PORT is overridden, use that host port instead of 2222.
    environment:
      INTERNAL_SERVICE_PORT: "${INTERNAL_SERVICE_PORT:-3000}"
      EXTERNAL_SERVICE_PORT: "${EXTERNAL_SERVICE_PORT:-3000}"
      GIT_CONFIG_USER_NAME: "${GIT_CONFIG_USER_NAME:-Codex Sandbox}"
      GIT_CONFIG_USER_EMAIL: "${GIT_CONFIG_USER_EMAIL:-}"
    volumes:
      - "${SSH_AUTH_SOCK}:/ssh-auth.sock"
      - ./state/home:/home/sandbox:rw
      - ./state/docker/certs/client:/certs/client:ro
    depends_on:
      docker:
        condition: service_healthy

  docker:
    # The standard DinD image runs a conventional rootful daemon.
    image: docker:29-dind
    restart: unless-stopped
    privileged: true
    ports:
      - "${EXTERNAL_SERVICE_PORT:-3000}:${INTERNAL_SERVICE_PORT:-3000}"
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - ./state/docker/data:/var/lib/docker
      - ./state/docker/certs:/certs
      # Nested bind mounts are resolved by the daemon, so this path must match
      # the workspace path in the sandbox service.
      - ./state/home/src:/home/sandbox/src
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
