services:
  sandbox:
    build:
      context: .
      pull: true
    image: cawad/codex-sandbox:latest
    container_name: nginx-ssh
    restart: unless-stopped
    # Codex's bubblewrap sandbox must create its own user and mount namespaces.
    security_opt:
      - seccomp=unconfined
    ports:
      - "${NGINX_HOST_HTTP_PORT:-8080}:8080"
      - "${NGINX_HOST_HTTPS_PORT:-4443}:4443"
      - "${SSHD_PORT:-2222}:2222"
    # First-time SSH connection
    # Run `ssh -p 2222 sandbox@127.0.0.1` from the same host environment as the
    # client, then review and accept the host key before using Codex Desktop.
    # If SSHD_PORT is overridden, use that host port instead of 2222.
    environment:
      NGINX_HOST_HTTP_PORT: "${NGINX_HOST_HTTP_PORT:-8080}"
      NGINX_HOST_HTTPS_PORT: "${NGINX_HOST_HTTPS_PORT:-4443}"
      GIT_CONFIG_USER_NAME: "${GIT_CONFIG_USER_NAME:-Codex Sandbox}"
      GIT_CONFIG_USER_EMAIL: "${GIT_CONFIG_USER_EMAIL:-}"
      # NGINX_SSL_CERTIFICATE: /etc/nginx/ssl/custom.crt
      # NGINX_SSL_CERTIFICATE_KEY: /etc/nginx/ssl/custom.key
      # NGINX_WEB_ROOT: /srv/www
    volumes:
      - ${SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
      - ./state/codex:/home/sandbox/.codex:rw
      - ./state/ssh-host-keys:/home/sandbox/.ssh/host-keys:rw
      - ./workspaces:/home/sandbox/src
      # - ./certs/server.crt:/etc/nginx/ssl/custom.crt:ro
      # - ./certs/server.key:/etc/nginx/ssl/custom.key:ro
      # - ./html:/srv/www:ro
